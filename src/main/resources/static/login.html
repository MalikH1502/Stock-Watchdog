<!DOCTYPE html>
<html lang = "en">
<head>
    <meta charset = "UTF-8">
    <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
    <title>Stock Watchdog - Sign In</title>
    <link rel = "stylesheet" href = "./login.css">
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
</head>

<body>
    <header class="login-header">
        <div class="login-brand">
            <span>Stock Watch</span>
        </div>
    </header>

    <main class="login-main">
        <div class="login-container">
            <div class="login-intro">
                <h1>Sign In</h1>
                <p>Enter your credentials to access Stock Watch.</p>
            </div>
        <div id="login-error" class="login-error" hidden>
            Invalid username or password.
        </div>
        <form action="/api/login" method="post">
            <input type="hidden" name="_csrf" id="login-csrf-token">
            <div class="login-field">
                <label for="login-username">Username</label>
                <input type="text" id="login-username" name="username" placeholder="Enter username" autocomplete="username" required>
            </div>
            <div class="login-field">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" name="password" placeholder="Enter password" autocomplete="current-password" required>
            </div>
            <button type="submit">Sign In</button>
        </form>
            <p class="signup-link">Don't have an account? <a href="./signup.html">Create an account</a></p>
        </div>
        <p class="login-status">SYSTEM STATUS: <span>ONLINE</span></p>
    </main>

    <script type="module">
        const params = new URLSearchParams(globalThis.location.search);
        const errorBanner = document.getElementById('login-error');
        const csrfInput = document.getElementById('login-csrf-token');

        if (params.has('error')) {
            errorBanner.hidden = false;
        }

        try {
            const response = await fetch('/api/csrf');
            const tokenData = await response.json();

            if (csrfInput) {
                csrfInput.value = tokenData.token;
            }
        } catch {
            if (csrfInput) {
                csrfInput.value = '';
            }
        }
    </script>
</body>
</html>

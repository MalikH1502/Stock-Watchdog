<!DOCTYPE html>
<html lang = "en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <meta charset = "UTF-8">
    <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel = "stylesheet" href = "./index.css">
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <script src="region-flags.js" defer></script>
    <script src="notifications.js" defer></script>
    <script src="form.js" defer></script>
</head>
<body>
    <div class = "sidebar">
        <h2>Stock Watchdog</h2>
        <h4> User Terminal</h4>
        <div class="tab-container">
            <ul>
                <li class="active"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-layout-template-icon lucide-layout-template"><rect width="18" height="7" x="3" y="3" rx="1"/><rect width="9" height="7" x="3" y="14" rx="1"/><rect width="5" height="7" x="16" y="14" rx="1"/></svg>
                    <button type="button" data-page="./index.html">Dashboard</button>
                </li>
                
                <li>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-bell-icon lucide-bell"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg>
                    <button type="button" data-page="./alerts.html">Alerts</button>
                </li>
                <li>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-settings-icon lucide-settings"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
                    <button type="button" data-page="./settings.html">Settings</button>
                </li>
            </ul>
            
        </div>
    </div>
    <div class="topbar">
    <h1>Dashboard</h1>
    <form id="search-form" action="/api/stocks" method="get">
        <label for="stock-search"></label>
        <div class="search-input-wrapper" style="position:relative; display:inline-block; width:100%; max-width:420px;">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false" style="position:absolute; left:10px; top:50%; transform:translateY(-50%); pointer-events:none; width:18px; height:18px; color:#9b9b9b;">
                <path d="M17 17L21 21" stroke="#9b9b9b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
                <path d="M19 11C19 6.58172 15.4183 3 11 3C6.58172 3 3 6.58172 3 11C3 15.4183 6.58172 19 11 19C15.4183 19 19 15.4183 19 11Z" stroke="#9b9b9b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
            </svg>
            <input type="search" id="stock-search" name="stock" placeholder="Search symbols.." style="padding-left:36px; width:100%; box-sizing:border-box;">
        </div>
        <span id="search-error" style="color:red; font-size:small;"></span>
    </form>
</div>
<div class="main-content">
    <div class="dashboard-stats">
        <div class="stat-card">
            <p class="stat-label">Total Tracked</p>
            <p class="stat-value" id="stat-total-tracked">0</p>
        </div>
        <div class="stat-card">
            <p class="stat-label">Alerts Set</p>
            <p class="stat-value" id="stat-alerts-set">0</p>
        </div>
    </div>
    <div class="dashboard-grid">
        <div class="dashboard-main">
            <div id="search-spinner" class="content-spinner"></div>
            <div id="results-container"></div>
        </div>
        <div class="panel dashboard-side">
            <p class="panel-title">Alerts Set</p>
            <div id="alerts-list"></div>
        </div>
    </div>
</div>
</body>
</html>
